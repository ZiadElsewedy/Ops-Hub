name: drop
description: "DROP OPERATIONS — role-based branch / shift operations management for DROP THE SHOP."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6

  # Navigation
  go_router: ^14.2.0

  # Networking — authenticated HTTP for the external NestJS API (chat backend).
  # The single HTTP seam is `core/network/api_client.dart`; nothing else may
  # import dio directly.
  dio: ^5.7.0

  # Connectivity — DROP requires a live connection to open (see
  # `core/network/connectivity_service.dart`). Reports the *interface* only,
  # which is why the service pairs it with a real reachability probe.
  connectivity_plus: ^6.1.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3

  # Location — GPS-verified attendance clock in/out (permission, high-accuracy
  # position, distance-to-branch). The single geolocation dependency.
  geolocator: ^13.0.1

  # Media
  image_picker: ^1.1.2
  # Document attachments in chat (images use image_picker's camera/gallery).
  file_picker: ^8.1.6
  # In-app crop / rotate / flip / aspect editor (mobile only — gated off on
  # desktop/web via `supportsImageEditing`).
  image_cropper: ^9.0.0
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  # Client-side video transcode before upload (mobile only — gated off on
  # desktop/web via `supportsVideoCompression`).
  video_compress: ^3.1.4

  # Observability — crash-report persistence (Application Support dir).
  path_provider: ^2.1.4

  # Single-active-session enforcement — the device's session id lives in the
  # Keychain (iOS/macOS) / EncryptedSharedPreferences (Android), NOT in the
  # uid-namespaced JSON stores in `core/services/`: those are per-user
  # preferences, while this is the credential the auth layer compares against
  # `users/{uid}.activeSessionId` to decide whether THIS device still owns the
  # session. It must survive nothing else being readable and must not be
  # trivially editable. The single seam is `core/services/session_store.dart`;
  # nothing else may import this package. (Still NOT `shared_preferences` —
  # see PROJECT_CONTEXT §4 "Single-source seams".)
  flutter_secure_storage: ^9.2.2

  # Code Generation (annotations only at runtime)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  lottie: ^3.4.0
  socket_io_client: ^3.1.6

  # Offline chat cache — Drift (SQLite). The chat feature's LocalDataSource
  # persists conversations/messages/reply+attachment metadata for instant open
  # and offline reads. Pinned to the 2.20.x line so `drift_dev`'s analyzer
  # constraint stays compatible with `freezed 2.5.x` (newer drift pulls
  # analyzer 7+, which freezed 2.5 does not allow). Never cache image BYTES —
  # URLs and metadata only. Confined to `features/chat/data/local/`.
  drift: 2.26.0
  sqlite3_flutter_libs: ^0.5.24
  # Filesystem path joining for the Drift database file (chat cache).
  path: ^1.9.0
  open_filex: ^4.7.0
  # Weekly attendance PDF (ADR-019). Pure Dart — deliberately NOT `printing`,
  # which adds platform plugin code for a print dialog we do not need: the file
  # is written beside the Schedule PNG export and handed to the OS share sheet
  # through `core/services/export_sharing.dart` (share_plus).
  pdf: ^3.11.1
  # Weekly schedule Excel (.xlsx) export. There is no pure-Dart xlsx writer we
  # can use — the `excel` package pins `archive ^3`, which conflicts with
  # `lottie`'s `archive ^4` — so the OOXML (SpreadsheetML) is hand-rolled and
  # zipped with `archive` directly, the same dependency-light path the
  # attendance/schedule PDF took over `printing`. See
  # `schedule/domain/reporting/schedule_final_xlsx.dart`.
  archive: ^4.0.0
  # Hands a mailto: / https: link to the OS so Support on the About page can
  # open the mail client or WhatsApp. `open_filex` cannot do this — it opens a
  # local file, not a URL.
  url_launcher: ^6.3.1
  # Real brand marks on the About page's Support rows (assets/gmail.svg,
  # assets/whatsapp.svg). Deliberately NOT an icon font: a font can only paint
  # one colour, which turned Gmail's four-colour M into a flat red glyph, and a
  # wrong logo reads worse than no logo.
  flutter_svg: ^2.0.10
  # The OS share sheet for an exported file (attendance PDF/CSV, schedule
  # PNG/PDF/XLSX). Owner-approved exception to the dependency-light stance
  # (2026-08-07): `open_filex` could only open a local viewer, so *sending* an
  # export took an extra hop through Quick Look. `share_plus` raises the real
  # share sheet (WhatsApp · Mail · AirDrop · Files) on iOS/Android/macOS. The
  # single seam is `core/services/export_sharing.dart`; never import `share_plus`
  # elsewhere.
  share_plus: ^12.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  # Drift table/database codegen. Pinned to match the `drift` runtime version
  # and the analyzer 7 line the rest of the codegen stack already uses.
  drift_dev: 2.26.0

  # App Icon
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/E22CA445-D611-4A31-8EE5-BB661032E09C.png"
  min_sdk_android: 21
  # macOS Dock/Finder icon — Big Sur squircle composed from assets/opshub_logo.png
  # (dark monochrome gradient + white DROP wordmark). The iconset under
  # macos/Runner/Assets.xcassets was generated from this master.
  macos:
    generate: true
    image_path: "assets/icon/app_icon_macos.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/opshub_logo.png
    - assets/gmail.svg
    - assets/whatsapp.svg
    - assets/0704.json
    - assets/submission_loading.json

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Phosphor navigation icons — self-hosted rather than via the
    # `phosphor_flutter` package, whose `PhosphorIconData extends IconData` no
    # longer compiles on Dart 3.12+ (IconData is now a final class). Two weights:
    # Regular (inactive nav) and Fill (active nav). Glyphs are addressed by
    # codepoint in `core/theme/phosphor_icons.dart`.
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
